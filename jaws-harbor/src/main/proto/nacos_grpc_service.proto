// Vendored from Nacos api/src/main/proto/nacos_grpc_service.proto
// Adapted for jaws-harbor: compatible with nacos-client gRPC wire format.
//
// The two gRPC services (Request, BiRequestStream) accept Payload messages
// whose body is JSON-serialized request/response objects. The metadata.type
// field carries the simple class name used for dispatch (e.g. "InstanceRequest",
// "ServerCheckResponse").

syntax = "proto3";

import "google/protobuf/any.proto";

option java_multiple_files = true;
option java_package = "org.hongxi.jaws.harbor.proto";

message Metadata {
  string type = 3;
  string clientIp = 8;
  map<string, string> headers = 7;
}

message Payload {
  Metadata metadata = 2;
  google.protobuf.Any body = 3;
}

service Request {
  // Sends a commonRequest
  rpc request (Payload) returns (Payload) {
  }
}

service BiRequestStream {
  // Sends a biStreamRequest
  rpc requestBiStream (stream Payload) returns (stream Payload) {
  }
}
