syntax = "proto3";

package org.hongxi.jaws.grpc;

option java_multiple_files = true;
option java_package = "org.hongxi.jaws.transport.grpc.proto";
option java_outer_classname = "JawsGrpcProto";

// Generic byte-payload request. The payload is serialized using Jaws Serialization
// (hessian2 or fastjson2), allowing gRPC to act as a pure transport layer
// without participating in business serialization.
message ByteRequest {
  bytes payload = 1;
}

// Generic byte-payload response. The payload is serialized using Jaws Serialization.
message ByteResponse {
  bytes payload = 1;
}

// Universal Jaws RPC service. All Jaws service interfaces are dispatched
// through this single gRPC service. The actual target interface and method
// are encoded inside the payload.
service JawsRpcService {
  // Unary invocation: one request, one response.
  rpc Invoke(ByteRequest) returns (ByteResponse);

  // Server-streaming invocation: one request, multiple responses.
  // Phase 2: to be implemented.
  // rpc StreamInvoke(ByteRequest) returns (stream ByteResponse);
}
