spring:
  application:
    name: sample-gray-provider

jaws:
  application:
    name: ${spring.application.name}
  protocol:
    name: jaws
    port: 10000
    serialization: fastjson2
  registry:
    address: nacos://127.0.0.1:8848
  # Set service tag for gray release routing.
  # Override via command line: --jaws.service.tag=gray
  service:
    tag: ""

logging:
  level:
    org.hongxi.jaws: INFO
