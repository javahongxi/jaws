spring:
  application:
    name: sample-wire-boot-provider

jaws:
  application:
    name: ${spring.application.name}
  protocol:
    # gRPC wire format over HTTP/2, served by the jaws-wire transport SPI.
    # transport-factory is intentionally omitted: the transport follows the
    # protocol name, so name=wire resolves to the "wire" transport
    name: wire
    port: 50051
    # Compress responses with gzip for callers advertising grpc-accept-encoding
    compression: gzip
  # Publish to Nacos so a peer that knows nothing about this sample can resolve it
  # by service name: jaws/<interface FQN> in group default_rpc, with the
  # protocol/path sentinel keys in the instance metadata. The in-JVM "local"
  # registry would keep the registration invisible outside this process, which
  # makes the discovery half of "wire protocol" impossible to demo from here.
  # Nacos must be listening on 127.0.0.1:8848.
  registry:
    address: nacos://127.0.0.1:8848
  service:
    check: true
