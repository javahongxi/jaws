# Profile: nacos — export the wire service into a real Nacos instead of the
# in-JVM "local" registry, so a process that knows nothing about this sample can
# find it by service name.
#
#   java -jar target/jaws-sample-wire-boot-provider.jar --spring.profiles.active=nacos
#
# Needs Nacos on 127.0.0.1:8848. The serviceName/group/metadata this actually
# writes are recorded in the sample README once measured — they are exactly what a
# consumer has to match, and they are not the same as what a grpc-go provider
# registers by itself (see jaws-sample-wire-sweet, which sets group=DEFAULT_GROUP
# and drops the namespace prefix to reach that one).
jaws:
  registry:
    address: nacos://127.0.0.1:8848
