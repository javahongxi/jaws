// The canonical grpc.health.v1 health checking protocol
// (https://github.com/grpc/grpc/blob/master/doc/health-checking.md),
// served by jaws-wire's WireHealthService so that standard gRPC clients
// (grpc_health_probe, load balancers, k8s probes) can check readiness.
//
// Reference only: this file is NOT compiled during the build (no protoc
// dependency). The generated message classes are vendored under
// org.hongxi.jaws.wire.health (generated with protobuf 4.34.1).

syntax = "proto3";

package grpc.health.v1;

option java_package = "org.hongxi.jaws.wire.health";
option java_outer_classname = "HealthProto";
option java_multiple_files = true;

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    // Used only by the Watch method to indicate the service does not exist
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);

  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}
